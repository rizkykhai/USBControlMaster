name: Build Agent EXE

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt PyInstaller

      - name: Build EXE
        working-directory: agent
        run: python -m PyInstaller --clean --onefile --name USBControlAgent --hidden-import=win32timezone USBControlAgent.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: USBControlAgent
          path: agent/dist/USBControlAgent.exe
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "USB Control Agent v${{ github.run_number }}"
          body: "Build otomatis dari commit ${{ github.sha }}"
          files: agent/dist/USBControlAgent.exe
          make_latest: true
